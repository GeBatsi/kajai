name: CI

on:
  pull_request:
  push:

jobs:
  ci:
    name: Lint · Type-check · Test · Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kajai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kajai_test
      NEXTAUTH_SECRET: ci-secret
      NEXTAUTH_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4001
      NEXT_TELEMETRY_DISABLED: 1
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  docker:
    name: Docker Compose smoke test
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose file
        run: docker compose config --quiet

      - name: Start infrastructure and API
        run: docker compose up -d --build --wait --wait-timeout 300 postgres redis meilisearch api

      - name: API health check
        run: curl -fsS http://localhost:4001/api/health

      - name: Start web
        run: docker compose up -d --build --wait --wait-timeout 300 web

      - name: Web check
        run: curl -fsS -o /dev/null -w "%{http_code}\n" http://localhost:4000/login

      - name: Container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose down -v
